<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccd0df;
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        .subtitle {
            text-align: center;
            color: gray;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .stats {
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        li {
            list-style: none;
            background: #f8fafc;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li.completed span {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: #ef4444;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .task-actions {
            display: flex;
            gap: 6px;
        }

        .task-actions button {
            padding: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Task Manager</h1>
    <p class="subtitle">Organize your daily activities easily!</p>

    <div class="input-area">
        <input type="text" id="taskInput"
        placeholder="Enter your task">

        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="stats">
        <h3>Total Tasks: <span id="total">0</span></h3>
        <p>Completed: <span id="completed">0</span></p>
    </div>

    <h3>My Tasks</h3>

    <ul id="taskList"></ul>

</div>

<script>

let total = 0;
let completed = 0;

function addTask() {

    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task!");
        return;
    }

    let li = document.createElement("li");

    let span = document.createElement("span");
    span.textContent = task;

    let actions = document.createElement("div");
    actions.className = "task-actions";

    let doneButton = document.createElement("button");
    doneButton.textContent = "Done";

    doneButton.onclick = function() {
        if (!li.classList.contains("completed")) {
            li.classList.add("completed");
            completed++;
            updateStats();
        }
    };

    let deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "delete";

    deleteButton.onclick = function() {
        if (li.classList.contains("completed")) {
            completed--;
        }

        li.remove();
        total--;
        updateStats();
    };

    actions.appendChild(doneButton);
    actions.appendChild(deleteButton);

    li.appendChild(span);
    li.appendChild(actions);

    document.getElementById("taskList").appendChild(li);

    total++;
    updateStats();

    input.value = "";
}

function updateStats() {
    document.getElementById("total").textContent = total;
    document.getElementById("completed").textContent = completed;
}

</script>

</body>
</html>
